
name: Build Tia Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unzip and create Android project
        run: |
          set -eu
          mkdir -p unzipped
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          test -n "$ZIP"
          unzip -q -o "$ZIP" -d unzipped
          SRC=$(dirname "$(find unzipped -name pubspec.yaml | head -1)")
          test -f "$SRC/pubspec.yaml"
          flutter create --platforms=android --project-name tia app
          cp "$SRC/pubspec.yaml" app/pubspec.yaml
          rm -rf app/lib
          cp -r "$SRC/lib" app/lib
          if [ -d "$SRC/assets" ]; then
            cp -r "$SRC/assets" app/assets
          fi
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' app/android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' app/android/app/build.gradle*
          sed -i 's#android:label="[^"]*"#android:label="Tia"#' app/android/app/src/main/AndroidManifest.xml

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/tia-release.jks"

          cat > app/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/tia-release.jks
          EOF

      - name: Configure Gradle release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              block = '''
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(FileInputStream(keystorePropertiesFile))

          '''
              if "val keystoreProperties =" not in s:
                  s = block + s

              signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
              if 'signingConfig = signingConfigs.getByName("release")' not in s:
                  s = s.replace(
                      'buildTypes {',
                      signing + '\\n    buildTypes {',
                      1
                  )
                  s = s.replace(
                      'buildTypes {',
                      'buildTypes {\\n        release { signingConfig = signingConfigs.getByName("release") }',
                      1
                  )
              p.write_text(s)
          else:
              p = Path("app/android/app/build.gradle")
              s = p.read_text()
              block = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          '''
              if "def keystoreProperties =" not in s:
                  s = block + s
              signing = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
              if 'signingConfig signingConfigs.release' not in s:
                  s = s.replace('buildTypes {',
                      signing + '\\n    buildTypes {\\n        release { signingConfig signingConfigs.release }',
                      1)
              p.write_text(s)
          PY

      - name: Raise compileSdk for plugins
        run: |
          set -eu
          if [ -f app/android/build.gradle.kts ]; then
            cat /tmp/hack.kts 2>/dev/null || true
          fi

      - name: Build signed release APK
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify APK signature
        run: |
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Tia-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
