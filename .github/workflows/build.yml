name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unzip and create Android project
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -q -o "$ZIP" -d unzipped
          SRC=$(dirname "$(find unzipped -name pubspec.yaml | head -1)")
          flutter create --platforms=android --project-name tia app
          cp "$SRC/pubspec.yaml" app/pubspec.yaml
          rm -rf app/lib && cp -r "$SRC/lib" app/lib
          cp -r "$SRC/assets" app/assets
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' app/android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Tia"#' app/android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: Tia-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
