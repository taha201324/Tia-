name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unzip and create Android project
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -q -o "$ZIP" -d unzipped
          SRC=$(dirname "$(find unzipped -name pubspec.yaml | head -1)")
          flutter create --platforms=android --project-name tia app
          cp "$SRC/pubspec.yaml" app/pubspec.yaml
          rm -rf app/lib && cp -r "$SRC/lib" app/lib
          cp -r "$SRC/assets" app/assets
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <application#' app/android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' app/android/app/build.gradle*
          sed -i 's#android:label="[^"]*"#android:label="Tia"#' app/android/app/src/main/AndroidManifest.xml
      - name: Raise compileSdk for all plugins
        run: |
          test -f app/android/build.gradle.kts
          cat > /tmp/hack.kts <<'EOF2'
          subprojects {
              afterEvaluate {
                  val ext = extensions.findByName("android")
                  if (ext != null) {
                      val m = ext.javaClass.methods.firstOrNull {
                          (it.name == "setCompileSdk" || it.name == "compileSdkVersion" || it.name == "compileSdk") &&
                              it.parameterCount == 1 &&
                              (it.parameterTypes[0] == Int::class.javaPrimitiveType || it.parameterTypes[0] == Int::class.javaObjectType)
                      }
                      m?.invoke(ext, 36)
                  }
              }
          }
          EOF2
          cat /tmp/hack.kts app/android/build.gradle.kts > /tmp/new.kts
          mv /tmp/new.kts app/android/build.gradle.kts
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: Tia-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
