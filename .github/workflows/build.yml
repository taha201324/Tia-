name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and add sources
        run: |
          for z in ./*.zip; do
            if [ -f "$z" ]; then
              echo "Unzipping $z"
              mkdir -p unz
              unzip -oq "$z" -d unz
            fi
          done
          if [ -f src/pubspec.yaml ]; then
            F=./src/pubspec.yaml
          else
            F=$(find . -type f -path '*/src/pubspec.yaml' -not -path './app/*' | head -1)
          fi
          if [ -z "$F" ]; then
            echo "src/pubspec.yaml not found. Files in repo:"
            find . -maxdepth 3 -not -path './.git*' | head -60
            exit 1
          fi
          SRC=$(dirname "$F")
          echo "Using sources from $SRC"
          flutter create --platforms=android --org com.example --project-name tia app
          cp "$SRC/pubspec.yaml" app/pubspec.yaml
          rm -rf app/lib && cp -r "$SRC/lib" app/lib
          cp -r "$SRC/assets" app/assets
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <application#' app/android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' app/android/app/build.gradle*
          sed -i 's#android:label="[^"]*"#android:label="Tia"#' app/android/app/src/main/AndroidManifest.xml
      - name: Verify package id
        run: |
          grep -rn "applicationId" app/android/app/build.gradle* | grep -q "com.example.tia" || (echo "package id is wrong" && exit 1)
          grep -n "applicationId\|namespace" app/android/app/build.gradle*
      - name: Set up release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$KS_B64"
          echo "$KS_B64" | base64 -d > app/android/app/tia-release.jks
          python3 - <<'PYEOF'
          import glob, re
          f = glob.glob('app/android/app/build.gradle*')[0]
          s = open(f).read()
          block = """signingConfigs {
              create("release") {
                  storeFile = file("tia-release.jks")
                  storePassword = System.getenv("TIA_STORE_PASSWORD")
                  keyAlias = System.getenv("TIA_KEY_ALIAS")
                  keyPassword = System.getenv("TIA_KEY_PASSWORD")
              }
          }
          buildTypes {"""
          assert 'buildTypes {' in s, 'buildTypes not found'
          s = s.replace('buildTypes {', block, 1)
          s, n = re.subn(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', 'signingConfig = signingConfigs.getByName("release")', s)
          assert n == 1, 'signingConfig line not found'
          open(f, 'w').write(s)
          PYEOF
      - name: Raise compileSdk for all plugins
        run: |
          test -f app/android/build.gradle.kts
          cat > /tmp/hack.kts <<'EOF2'
          subprojects {
              afterEvaluate {
                  val ext = extensions.findByName("android")
                  if (ext != null) {
                      val m = ext.javaClass.methods.firstOrNull {
                          (it.name == "setCompileSdk" || it.name == "compileSdkVersion" || it.name == "compileSdk") &&
                              it.parameterCount == 1 &&
                              (it.parameterTypes[0] == Int::class.javaPrimitiveType || it.parameterTypes[0] == Int::class.javaObjectType)
                      }
                      m?.invoke(ext, 36)
                  }
              }
          }
          EOF2
          cat /tmp/hack.kts app/android/build.gradle.kts > /tmp/new.kts
          mv /tmp/new.kts app/android/build.gradle.kts
      - name: Prepare plugins (add missing Android namespace)
        working-directory: app
        run: |
          flutter pub get
          for d in $(find "$HOME/.pub-cache" -type d -path '*/android' -not -path '*/example/*' 2>/dev/null); do
            g=""
            [ -f "$d/build.gradle" ] && g="$d/build.gradle"
            [ -f "$d/build.gradle.kts" ] && g="$d/build.gradle.kts"
            [ -z "$g" ] && continue
            grep -q "namespace" "$g" && continue
            m="$d/src/main/AndroidManifest.xml"
            [ -f "$m" ] || continue
            pkg=$(grep -o 'package="[^"]*"' "$m" | head -1 | sed 's/package="\(.*\)"/\1/')
            [ -z "$pkg" ] && continue
            echo "Adding namespace $pkg to $g"
            case "$g" in
              *.kts) sed -i "0,/^android {/s//android {\n    namespace = \"$pkg\"/" "$g" ;;
              *) sed -i "0,/^android {/s//android {\n    namespace '$pkg'/" "$g" ;;
            esac
          done
      - name: Build APK
        working-directory: app
        env:
          TIA_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=GIPHY_KEY=${{ secrets.GIPHY_KEY }}
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: Tia-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
